; Projet exemple : persistance FRAM I2C (PersistanceFRAM)
; Nécessite la dépendance Fo170/FRAM_I2C_FM24CL16B et la librairie Persistance
; (racine du dépôt, lib_extra_dirs = ../..).

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_deps =
    Fo170/FRAM_I2C_FM24CL16B >= 1.0
